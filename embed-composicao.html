<!-- Embed: ranking dos tipos de dívida na Série A (soma dos 20 clubes, balanço de 2025).
     Clicando num tipo, o leitor vê o ranking completo dos clubes. Para abrir direto num tipo, acrescente ao src:
     #tipo=trab (trabalhistas, impostos e parcelamentos), #tipo=trf (transferências), #tipo=out (empréstimos e outras),
     #tipo=prov (provisões), #tipo=forn (fornecedores), #tipo=part (partes relacionadas), #tipo=imag (direitos de imagem) -->
<iframe class="dividas-clubes"
  src="https://igorsiqueirahub.github.io/dividas-clubes/composicao.html"
  title="Tipos de dívida: o que mais pesa na Série A"
  style="width:100%;height:2200px;border:0;display:block" loading="lazy"></iframe>
<script>
/* Ajusta a altura do iframe ao conteúdo (o mesmo script dos outros embeds; se já houver um na página, não precisa repetir) */
(function () {
  if (window.__dividasClubes) return; window.__dividasClubes = true;
  window.addEventListener('message', function (e) {
    var d = e.data; if (!d || typeof d.type !== 'string' || d.type.indexOf('dividas-clubes:') !== 0) return;
    document.querySelectorAll('iframe.dividas-clubes').forEach(function (f) {
      if (f.contentWindow !== e.source) return;
      if (d.type === 'dividas-clubes:pronto') f.contentWindow.postMessage({ type: 'dividas-clubes:pagina', url: location.href }, '*');
      if (d.type === 'dividas-clubes:altura') f.style.height = d.altura + 'px';
      if (d.type === 'dividas-clubes:rolar') {
        var alvo = f.getBoundingClientRect().top + window.pageYOffset + d.y;
        if (Math.abs(window.pageYOffset - alvo) > 4) window.scrollTo({ top: alvo, behavior: 'smooth' });
      }
    });
  });
})();
</script>
