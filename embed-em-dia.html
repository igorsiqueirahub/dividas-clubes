(function () {
  if (window.__dividasClubes) return; window.__dividasClubes = true;
  window.addEventListener('message', function (e) {

      if (d.type === 'dividas-clubes:rolar') {
        var alvo = f.getBoundingClientRect().top + window.pageYOffset + d.y;

      }
    });
  });
})();
