<!-- Cole este trecho no código-fonte da sua página, onde o painel deve aparecer.
     Para abrir em outra aba ou série, troque o final do src: #aba=atrasos&serie=B, #aba=divida&serie=A ... -->
<iframe class="dividas-clubes"
  src="https://igorsiqueirahub.github.io/dividas-clubes/?embed=1&fundo=branco#aba=atrasos&serie=A"
  title="Dívidas dos clubes das Séries A e B"
  allow="clipboard-write" style="width:100%;height:1200px;border:0;display:block" loading="lazy"></iframe>
<script>
/* Ajusta a altura do iframe, volta ao topo do painel quando o leitor navega nele
   e faz o botão "Copiar link" copiar o endereço desta página */
(function () {
  if (window.__dividasClubes) return; window.__dividasClubes = true;
  window.addEventListener('message', function (e) {
    var d = e.data; if (!d || typeof d.type !== 'string' || d.type.indexOf('dividas-clubes:') !== 0) return;
    document.querySelectorAll('iframe.dividas-clubes').forEach(function (f) {
      if (f.contentWindow !== e.source) return;
      if (d.type === 'dividas-clubes:pronto') f.contentWindow.postMessage({ type: 'dividas-clubes:pagina', url: location.href }, '*');
      if (d.type === 'dividas-clubes:altura') f.style.height = d.altura + 'px';
      if (d.type === 'dividas-clubes:rolar') {
        var alvo = f.getBoundingClientRect().top + window.pageYOffset + d.y;
        if (window.pageYOffset > alvo) window.scrollTo({ top: alvo, behavior: 'smooth' });
      }
    });
  });
})();
</script>
